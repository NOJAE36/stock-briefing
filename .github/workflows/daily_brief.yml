name: Daily Stock Briefing

on:
  schedule:
    # 평일 매시간 5분마다 실행 (한국시간 월요일 09:05 ~ 토요일 08:05)
    - cron: '5 * * * 1-5'
    # 토요일 오전 미국 애프터장 마감까지 커버 (한국시간 토요일 09:05, 10:05)
    - cron: '5 0,1 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser yfinance pandas

      - name: Run Briefing Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python bot.py

      - name: Force Commit and Push index.html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update V5.3 hourly dashboard" || echo "No changes to commit"
          git push origin HEAD:main --force
