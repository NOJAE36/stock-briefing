name: Daily Stock Briefing

on:
  schedule:
    # 1. 미국 본장 마감 & 애프터장 시작 직후 (한국시간 화~토 06:05 / UTC 월~금 21:05)
    - cron: '5 21 * * 1-5'
    # 2. 미국 애프터장 마감 & 한국 장초반 (한국시간 화~토 10:05 / UTC 화~토 01:05)
    - cron: '5 1 * * 2-6'
    # 3. 한국 정규장 마감 직후 (한국시간 월~금 15:40 / UTC 월~금 06:40)
    - cron: '40 6 * * 1-5'
    # 4. 미국 프리장 개장 직후 (한국시간 월~금 18:05 / UTC 월~금 09:05)
    - cron: '5 9 * * 1-5'
    # 5. 미국 본장 개장 직후 (한국시간 월~금 23:35 / UTC 월~금 14:35)
    - cron: '35 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser yfinance pandas

      - name: Run Briefing Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python bot.py

      - name: Force Commit and Push index.html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update V5.2 dashboard" || echo "No changes to commit"
          git push origin HEAD:main --force
