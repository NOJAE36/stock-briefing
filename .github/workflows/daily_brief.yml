name: Daily Stock Briefing

on:
  schedule:
    # 평일(월~금) 매시 12분 실행 (정각 병목 회피로 지연 최소화)
    - cron: '12 * * * 1-5'
    # 토요일 새벽~오전(미국 금요일 본장·애프터장 마감 반영) 및 토·일요일 정기 브리핑 시간(KST 08시, 22시) 실행
    - cron: '12 0,1,13,23 * * 6,0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests feedparser yfinance pandas numpy pillow

      - name: Run Master Control Tower V7.0
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Commit and Push Live Dashboard & Image
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add index.html last_sent.txt
          if [ -f dashboard_card.png ]; then git add dashboard_card.png; fi
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update V7.0 dashboard" && git pull --rebase origin main && git push)
