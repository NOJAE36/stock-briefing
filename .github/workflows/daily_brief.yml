name: Daily Stock Briefing

on:
  schedule:
    # 1. 매일 아침 7시 30분 KST (UTC 기준 전날 22:30)
    - cron: '30 22 * * *'
    # 2. 매일 밤 10시 00분 KST (미국 장 시작 전, UTC 기준 13:00)
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-brief:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 2. 파이썬 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 금융 및 뉴스 수집 도구 설치
        run: |
          pip install requests feedparser yfinance

      - name: 4. 텔레그램 전송 및 HTML 대시보드 생성
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python bot.py

      - name: 5. 최신화된 HTML 대시보드 자동 저장 (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update mobile dashboard" && git push)
