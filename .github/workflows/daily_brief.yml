name: Daily Stock Briefing

on:
  schedule:
    - cron: '30 22 * * *'  # 한국시간 아침 07:30
    - cron: '0 13 * * *'   # 한국시간 밤 22:00
  workflow_dispatch:       # 수동 실행 버튼 활성화

permissions:
  contents: write          # index.html 자동 저장 권한 부여

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser yfinance pandas

      - name: Run Briefing Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python bot.py

      - name: Commit and Push index.html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-update V5 dashboard"
          git pull --rebase origin main || true
          git push origin HEAD:main
