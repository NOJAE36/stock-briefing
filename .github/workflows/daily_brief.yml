name: Daily Stock Briefing

on:
  schedule:
    # 매일 한국 시간 아침 7시 30분 (UTC 기준 전날 22:30) 자동 실행
    - cron: '30 22 * * *'
  workflow_dispatch: # 내가 원할 때 언제든 수동으로 즉시 실행할 수 있는 버튼 활성화

jobs:
  send-brief:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 2. 파이썬 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 금융 및 뉴스 수집 도구 설치
        run: |
          pip install requests feedparser yfinance

      - name: 4. 주식 비서 봇 실행 및 텔레그램 전송
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py
